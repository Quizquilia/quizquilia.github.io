<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizquilia</title>
<meta name="description" content="Quizquilia – quizdom is power. Starting soon.">
<link rel="icon" href="signet-l2.png" type="image/png">
<style>
  :root { --blau:#19375F; /* exakt der Hintergrund von wortmarke-p3b.png */ --gold:#E0A526; --creme:#FBF7EF; --grau:#9FB3CC; }
  html,body { margin:0; height:100%; }
  body { background:var(--blau); font-family:Futura,"Avenir Next","Century Gothic",system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 16px; box-sizing:border-box; }
  .signet { position:fixed; top:16px; left:16px; width:120px; display:block; }
  .signet svg { width:100%; height:auto; display:block; }
  .kopf { width:min(640px,100%); }
  .wort, .slogan { width:100%; height:auto; display:block; }
  .slogan { margin:.6rem 0 2.5rem; }
  .bald { position:fixed; left:0; right:0; bottom:40px; margin:0; color:var(--grau); font-size:.8rem; font-weight:500; letter-spacing:.3em; text-transform:uppercase; }
</style>
</head>
<body>
  <a class="signet" href="/" aria-label="Quizquilia – home">
    <svg viewBox="40 65 316 330" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(200,200) scale(1.75) translate(-207,-202.5)" stroke="#E0A526" stroke-width="16.5" fill="none" stroke-linecap="round">
        <circle cx="160" cy="170" r="30"/>
        <path d="M160,200Q190,200,190,216V262"/>
        <path d="M224,151.5A30,30,0,1,1,254,200Q224,200,224,216V230"/>
        <circle cx="224" cy="262" r="11.25" fill="#E0A526" stroke="none"/>
      </g>
      <text x="48" y="388" textLength="300" lengthAdjust="spacing" font-family="Futura,'Avenir Next',sans-serif" font-weight="500" font-size="34" fill="#9FB3CC">QUIZQUILIA</text>
    </svg>
  </a>
  <div class="kopf">
    <img class="wort" src="wortmarke-p3b.png" alt="Quizquilia">
    <!-- gleiche Breite wie die Wortmarke: im 900er-Bild reicht sie von x≈212 bis x≈690 -->
    <svg class="slogan" viewBox="0 0 900 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="quizdom is power">
      <text x="213" y="50" textLength="477" lengthAdjust="spacing" font-family="Futura,'Avenir Next',sans-serif" font-weight="500" font-size="42" fill="#E0A526"><tspan fill="#FBF7EF">q</tspan>uizdom is <tspan fill="#FBF7EF">p</tspan>ower</text>
    </svg>
  </div>
  <p class="bald">Starting soon</p>
</body>
</html>
