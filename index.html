<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizquilia</title>
<meta name="description" content="Quizquilia – Quizdom is power. Starting soon.">
<link rel="icon" href="signet-l2.png" type="image/png">
<style>
  :root { --blau:#1F3A5F; --gold:#E0A526; --grau:#9FB3CC; }
  html,body { margin:0; height:100%; }
  body { background:var(--blau); font-family:Futura,"Avenir Next","Century Gothic",system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 16px; box-sizing:border-box; }
  .signet { position:fixed; top:16px; left:16px; width:72px; height:72px; }
  .signet img { width:100%; height:100%; display:block; }
  .wort { width:min(640px,100%); height:auto; }
  .slogan { color:var(--gold); font-size:1.3rem; letter-spacing:.08em; margin:.5rem 0 1.5rem; }
  .bald { color:var(--grau); font-size:1rem; letter-spacing:.2em; text-transform:uppercase; }
</style>
</head>
<body>
  <a class="signet" href="/"><img src="signet-l2.png" alt="Quizquilia – home"></a>
  <img class="wort" src="wortmarke-p3.png" alt="Quizquilia">
  <p class="slogan">Quizdom is power</p>
  <p class="bald">Starting soon</p>
</body>
</html>
