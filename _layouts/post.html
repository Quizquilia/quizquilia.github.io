---
layout: default
---
<header class="beitragskopf">
    <a href="/" aria-label="Quizquilia – Startseite"><img src="/signet-l2.svg" alt="Quizquilia" width="56" height="56"></a>
  </header>
  <article class="text">
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{% include datum.html datum=page.date %}</time>
      {%- if page.tags and page.tags.size > 0 %} · {% for t in page.tags %}<span class="tag">{{ t }}</span>{% unless forloop.last %}, {% endunless %}{% endfor %}{% endif %}</p>
    {{ content }}
    <p class="zurueck"><a href="/">← Alle Beiträge</a></p>
  </article>
